name: nostr_mail
description: A Dart SDK for sending and receiving emails over the Nostr protocol using NIP-59 gift-wrapped messages.
version: 3.0.0
repository: https://github.com/nogringo/nostr-mail-dart
homepage: https://github.com/nogringo/nostr-mail-dart
issue_tracker: https://github.com/nogringo/nostr-mail-dart/issues

topics:
  - nostr
  - email
  - encryption
  - messaging
  - decentralized

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.12.0

dependencies:
  ndk: ^0.9.2
  enough_mail_plus: ^2.2.4
  nostr_event_scheduler: ^0.4.0
  sembast: ^3.8.6
  http: ^1.6.0
  html: ^0.15.6
  cryptography: ^2.9.0
  drift: ^2.34.4
  rxdart: ^0.28.0
  broadcast_queue_shim_for_ndk: ^0.5.0
  blossom_upload_queue_shim_for_ndk: ^0.7.0
  blossom_cache: ^0.4.0
  sync_engine_shim_for_ndk: ^0.4.0

dev_dependencies:
  bip340: ^0.3.1
  build_runner: ^2.16.1
  drift_dev: ^2.34.6
  idb_shim: ^2.9.6+2
  lints: ^6.1.0
  nostr_scheduler_dvm: ^0.2.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  test: ^1.31.2
  crypto: ^3.0.7
